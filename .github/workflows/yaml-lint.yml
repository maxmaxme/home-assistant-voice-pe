name: YAML lint

on:
  push:
    branches: [main, dev]
    paths:
      - "**.yaml"
      - "**.yml"
  pull_request:

jobs:
  yamllint:
    name: 🧹 yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out configuration from GitHub
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: 🚀 Run yamllint
        run: yamllint --strict .
