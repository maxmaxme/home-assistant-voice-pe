substitutions:
  name: atom-echo-s3r
  friendly_name: Atom Echo S3R
  # va-direct: voice-assistant WS endpoint (mDNS on LAN).
  va_url: "ws://va.local:3001/voice"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.6.0
  on_boot:
    priority: 375
    then:
      - switch.turn_on: speaker_amp
      # ES8311 ADC digital volume (reg 0x17), raised above the 0xC8 the esphome
      # es8311 component hardcodes. The uplink to the backend gets NO digital
      # boost anywhere else: micro_wake_word's `gain_factor` applies only to its
      # own MicrophoneSource copy, and va_client forwards the raw mic frames —
      # hence "wake fires but the model only hears me from half a metre". This
      # register sits before the I2S bus, so it lifts both paths.
      # Scale: gain_dB = -95.5 + 0.5 * N. 0xC8 = +4.5 dB (component default),
      # 0xE0 = +16.5 dB, 0xFF = +32 dB (the register's ceiling).
      # Back at the 0xC8 default after measuring an actual mic dump: at 0xE0 on
      # top of the 42DB PGA the uplink was 2.7% clipped with only 7 dB between
      # the hiss floor (-11.7 dBFS) and speech (-4.4 dBFS) — the chain was
      # amplifying its own noise into the server VAD, not the room. Compare:
      # the Voice PE measures 41 dB SNR on the same backend. Level is cheap to
      # buy back digitally (va_client `mic_gain`); this SNR is not.
      # Runs at priority 375, i.e. after the codec's own setup() at DATA.
      - lambda: |-
          const uint8_t adc_volume[2] = {0x17, 0xC8};
          auto err = id(bus_a)->write(0x18, adc_volume, 2);
          ESP_LOGI("mic_gain", "ES8311 ADC volume 0x%02X -> i2c err %d", adc_volume[1], (int) err);
      # Seed va_client with the restored media_player volume (same pattern as
      # the Voice PE config). The media_player owns the ES8311 DAC volume;
      # va_client's software scale stacks on top so the assistant stays a bit
      # quieter than full-scale announcements. The old fixed 0.12 pin is gone —
      # the HA volume slider is the single loudness knob now.
      - lambda: |-
          id(va).set_volume(id(external_media_player).is_muted() ? 0.0f
                                                                 : id(external_media_player).volume);
      # micro_wake_word is started from on_phase (phase == "idle") below, not
      # here: it finishes setup AFTER on_boot fires, so an on_boot start would
      # no-op with "hasn't been setup yet". The first idle phase (emitted early,
      # even before the WS connects) starts it — no boot delay needed.

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# va-direct: NTP wall clock for udp_log timestamps (same as the Voice PE
# config). Without it JSON log lines go out without `time` and Dozzle
# stamps by packet arrival — coarse but functional.
time:
  - platform: sntp
    id: sntp_time

# va-direct: forward device logs to the shared UDP sink on the Pi
# (voice-pe-logs in home-infra/docker-compose.yml) so they land in Dozzle
# alongside the Voice PE. Both speakers share this one sink; the `device`
# field udp_log emits (App.get_name(), MAC-suffixed) keeps them apart.
udp_log:
  host: va.local
  port: 5140
  level: DEBUG
  time_id: sntp_time

# va-direct: `api:` is an entity/announcement channel only — the voice path
# stays on the va_client WS. HA sees the device and its `Media Player`
# entity, so scripts/automations can play announcements (tts.speak,
# play_media with announce) through the mixer's announcement input. Also
# restores stock mDNS advertisement for `esphome run` discovery.
api:
  id: api_id
  encryption:  # Uses key set by Home Assistant
  # Stock default (15min) reboots the device when no API client is connected.
  # Here HA is optional — the voice path must survive HA being down.
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: ota_esphome

# Not implicit since esphome 2024.6: without this a boot-looping build bricks
# the device until someone opens the case for serial — with it, repeated boot
# failures fall back to a minimal WiFi+OTA image that can be re-flashed OTA.
safe_mode:

# Minimal provisioning: connect to the AP captive portal on first boot to
# enter WiFi creds; they then live in NVS. (No Improv on this thin client.)
wifi:
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password
captive_portal:

# Pinout corrected against the device's printed silkscreen (the design-doc
# map was written blind from M5 docs and had SDA/SCL, MCLK/LRCK and the amp
# pin wrong). SCL is GPIO0 (a strapping pin, fine as I2C after boot).
i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO0
    frequency: 400kHz

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    # Analog PGA gain (42DB is the component max). Feeds both the STT uplink and
    # the wake-word path — more gain = easier wake/VAD detection. (The
    # reply-audio distortion we chased earlier was the SPEAKER volume, not
    # this.) 42DB was picked by ear for distance and turned out to be well past
    # the point where the analog chain's own noise dominates: 7 dB SNR and 2.7%
    # clipping on a measured mic dump (see the ADC-volume note in on_boot).
    # 30DB is the measured restart point — re-dump and compare SNR before
    # moving it, and buy level back with va_client `mic_gain`, not here.
    mic_gain: 30DB
    # Do NOT set use_microphone: true here. In the esphome es8311 component
    # that flag sets reg14 BIT(6) = "enable PDM digital microphone", routing
    # the ADC to the codec's PDM input. This board has an ANALOG MEMS mic, so
    # PDM mode captures silence. The analog ADC path (reg14 analog-mic + PGA,
    # ADC modulator, SDPOUT) is enabled unconditionally in setup(), so the
    # mic works with the default use_microphone: false.

# ES8311 is a single full-duplex codec: ADC (mic) and DAC (speaker) share one
# I2S bus and therefore one sample rate. Run the bus at 16 kHz (the mic uplink
# rate the backend expects); va_client's 24 kHz speaker output is converted
# down to 16 kHz by the resampler below.
i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO3
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

microphone:
  - platform: i2s_audio
    id: echo_mic
    i2s_din_pin: GPIO4
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    # esphome 2026.6+ rejects `mono` on I2S ("does not support mono") — the
    # ES8311 ADC sits on the left slot; va_client reads it via mic_channel: 0.
    channel: left
    i2s_mode: primary
    i2s_audio_id: i2s_shared

speaker:
  # Hardware speaker output via the ES8311 DAC + NS4150B amp.
  - platform: i2s_audio
    id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO48
    sample_rate: 16000
    bits_per_sample: 16bit
    # `left`, not `mono`: mono uses a single-slot I2S frame, but the ES8311
    # DAC expects a stereo Philips frame (data in the left slot). A mono frame
    # is read at the wrong slot boundaries → level-independent distortion.
    # Matches the known-working Atom Echo S3R config.
    channel: left
    i2s_mode: primary
    i2s_audio_id: i2s_shared
    audio_dac: es8311_dac
    # NO `timeout: never`: the i2s_audio bus is a mutex shared with the mic
    # (i2s_audio.h try_lock), and `never` makes the speaker hold it forever —
    # starving micro_wake_word (mic try_lock fails → endless "Driver failed to
    # start"). A finite timeout releases the bus in idle so the mic can listen
    # for the wake word; the speaker re-acquires it for each reply.
    # The 500 ms buffer still smooths WS-chunk jitter (hiss between chunks).
    buffer_duration: 500ms
  # Mixer wraps the i2s leaf (same shape as the Voice PE config) so the
  # va_client reply and an HA announcement can play concurrently instead of
  # fighting over the leaf. The leaf's finite timeout still releases the
  # mutex bus in idle so the mic can listen for the wake word.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: va_mixing_input
        timeout: never
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
  # va_client writes 24 kHz mono PCM16 here; the resampler converts to the
  # 16 kHz hardware bus rate.
  - platform: resampler
    id: va_speaker
    output_speaker: va_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
  - platform: resampler
    id: announcement_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
  - platform: resampler
    id: media_speaker
    output_speaker: media_mixing_input
    sample_rate: 16000
    bits_per_sample: 16

media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 250000

# HA-facing player. Voice replies do NOT go through it — va_client writes
# into va_speaker directly. Announcements (tts.speak / play_media with
# announce:true) use the announcement pipeline; plain play_media (e.g. the
# HA media library) uses the media pipeline. Declaring a format on BOTH
# pipelines matters: HA transcodes to the declared format (FLAC 16k mono)
# only for purposes that declare one — with no media pipeline it ships the
# raw file, and only a FLAC decoder is compiled into this firmware.
media_player:
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    media_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 16000
      speaker: media_speaker
      sources:
        - http_media_source
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 16000
      speaker: announcement_speaker
      sources:
        - http_announcement_source
    volume_increment: 0.05
    # These land on the ES8311 DAC volume register, which is dB-LINEAR in the
    # 0..1 value: 0.75 = 0 dB, 1.0 = +32 dB, each 0.01 ≈ 1.3 dB. Values below
    # ~0.5 are effectively silence — do NOT treat this like a linear gain.
    # min 0.75 (0 dB) .. max 0.9 (+20 dB) keeps the NS4150B amp out of hard
    # clipping; volume_initial 0.75 ≈ the loudness of the old fixed va 0.12
    # pin. Tune with the HA slider.
    volume_min: 0.75
    volume_max: 0.9
    volume_initial: 0.75
    # Mirror volume / mute into va_client's software scale (same as Voice PE)
    # so the slider controls the assistant's voice too.
    on_volume:
      - lambda: |-
          id(va).set_volume(id(external_media_player).is_muted() ? 0.0f
                                                                 : id(external_media_player).volume);
    on_mute:
      - lambda: 'id(va).set_volume(0.0f);'
    on_unmute:
      - lambda: 'id(va).set_volume(id(external_media_player).volume);'
    # Shared-mutex I2S bus: micro_wake_word holds the mic side, so the
    # announcement pipeline can't take the bus until mww releases it (the
    # speaker retries with "bus busy"). Mirror the reply-path choreography:
    # stop mww when an announcement starts, restart it when the player goes
    # idle — but only if the assistant is idle too and no tone owns the bus.
    on_announcement:
      - micro_wake_word.stop
    # Media playback needs the same handoff. Consequence of the single-owner
    # bus: no wake word while media is playing OR paused — stop/cancel via HA
    # or the button.
    on_play:
      - micro_wake_word.stop
    on_idle:
      # The pipeline goes IDLE while the leaf speaker is still draining its
      # buffer (and holding the mutex bus for its timeout window). Starting
      # mww right away fails with "Driver failed to start; retrying" spam —
      # wait for the leaf to actually release the bus first.
      - wait_until:
          condition:
            lambda: 'return id(i2s_speaker)->is_stopped();'
          timeout: 5s
      - if:
          condition:
            # Re-check after the wait: another announcement, a turn or a tone
            # may have grabbed the bus meanwhile.
            lambda: |-
              return id(va_phase) == "idle" && !id(tone_playing) &&
                     id(external_media_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_IDLE;
          then:
            - micro_wake_word.start

switch:
  - platform: gpio
    id: speaker_amp
    pin: GPIO18
    restore_mode: ALWAYS_OFF
    internal: true

globals:
  # Last phase reported by va_client's on_phase. Lets yaml tell a follow-up
  # window opening (listening arriving out of idle without a local
  # start_session) apart from a normal turn — this device has no LED phase
  # global to consult like the Voice PE config.
  - id: va_phase
    type: std::string
    restore_value: no
    initial_value: '"idle"'
  # True while a follow-up window (ambient or chimed) is behind the current
  # `listening` phase. Consulted by on_phase to keep the `stop` wake word
  # armed during follow-up listening; cleared on any non-listening phase and
  # before every locally-started session.
  - id: followup_listening
    type: bool
    restore_value: no
    initial_value: 'false'
  # True while any rtttl tone (wake beep or a cue) is playing. on_phase's
  # idle→mww.start is skipped while set, so the phase machine doesn't grab the
  # mic bus mid-tone; the tone's own on_finished_playback restarts mww.
  - id: tone_playing
    type: bool
    restore_value: no
    initial_value: 'false'
  # True only for the wake/start beep: tells on_finished_playback to open the
  # session mic after the tone. Cue tones leave it false (tone → back to idle).
  - id: pending_start_session
    type: bool
    restore_value: no
    initial_value: 'false'
  # Like pending_start_session, but for the follow-up "your turn" chime: after
  # the tone, commit the follow-up mic instead of a fresh session.
  - id: pending_followup
    type: bool
    restore_value: no
    initial_value: 'false'

# Wake-word beep. Plays through the raw i2s_speaker (not the resampler/va_client
# path) with its own low gain — va_client's TTS volume does NOT apply here.
# Fired from on_wake_word_detected after mww is stopped to free the mutex bus.
# Keep the gain low: the NS4150B amp is loud (see the va_client volume saga).
rtttl:
  id: wake_beep
  speaker: i2s_speaker
  gain: 70%
  # The mic can't take the mutex bus while the speaker still holds it after the
  # beep (its 500 ms idle timeout), which was swallowing the user's first
  # utterance. So open the session mic HERE, when the beep truly ends: force
  # the speaker to release the bus, then start the session. Length-independent,
  # no guessed delay.
  on_finished_playback:
    - speaker.stop: i2s_speaker
    # rtttl calls i2s_speaker->set_volume(gain) (rtttl.cpp:108) and never
    # restores it. Re-apply the media_player's volume (it owns the ES8311 DAC
    # register) by re-setting it to its current value — a plain 1.0f restore
    # would slam the DAC to +32 dB and clobber the slider setting.
    - media_player.volume_set:
        id: external_media_player
        volume: !lambda 'return id(external_media_player).volume;'
    - delay: 150ms
    # va_client does NOT start the mic itself (it only registers a data
    # callback, va_client.cpp:86) — it relies on micro_wake_word keeping
    # echo_mic capturing. We stopped mww for the beep, so restart it here or
    # the listening mic streams silence and the server never hears the user.
    # (mww is stopped again at `thinking` for the reply's bus handoff.)
    - micro_wake_word.start
    # Tone finished: clear the guard, and open the session mic only if this was
    # a wake/start beep. Cue tones leave pending_start_session false → they just
    # return to idle wake-word listening.
    - lambda: id(tone_playing) = false;
    - if:
        condition:
          lambda: 'return id(pending_start_session);'
        then:
          - lambda: |-
              id(pending_start_session) = false;
              id(va)->start_session();
    - if:
        condition:
          lambda: 'return id(pending_followup);'
        then:
          # Arm the flag right before commit so on_phase (deferred) reads it.
          - lambda: |-
              id(pending_followup) = false;
              id(followup_listening) = true;
              id(va)->commit_followup_mic();

micro_wake_word:
  id: mww
  task_stack_in_psram: true
  microphone:
    microphone: echo_mic
    # Channel INDEX into the mic stream (not a count): the left-slot mono
    # signal is channel 0. Must match the mic's `channel: left` above or
    # esphome 2026.6+ fails config with a channels mismatch.
    channels: 0
    # Digital boost for the wake-word path only (does NOT affect the STT
    # uplink). Raised ×16 in lockstep with the analog PGA (42→30DB) and the ADC
    # volume (0xE0→0xC8) coming down by 24 dB total: those two feed BOTH paths,
    # so without this the wake word would just stop hearing anyone. Net level
    # into mww is unchanged — a noisier copy of the same level, which the wake
    # model tolerates far better than the uplink did. Drop it if wake starts
    # false-triggering.
    gain_factor: 32
  stop_after_detection: false
  # No `vad:` gate: on this mic the VAD model consistently fails to confirm
  # real speech (wake model fires on "okay nabu" but VAD blocks it → multi-
  # second detection lag). The wake model does NOT false-fire in silence here,
  # so dropping the VAD requirement is safe and makes detection near-instant.
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
  on_wake_word_detected:
    # The "stop" model is a cancel signal, not a session start. send_interrupt()
    # is a no-op when idle, so an unconditional call is safe.
    - if:
        condition:
          lambda: 'return wake_word == "Stop" || wake_word == "stop";'
        then:
          - lambda: |-
              id(followup_listening) = false;
              id(va)->send_interrupt();
          - script.execute:
              id: play_cue
              song: "cancel:d=16,o=5,b=200:g,e"
        else:
          # Fresh turn — same path as the button press (see the start_turn
          # script): clears the follow-up flag, pre-marks va_phase, beeps, and
          # opens the mic once the beep's bus lock clears.
          - script.execute: start_turn

external_components:
  - source:
      type: local
      path: esphome/components
    components: [va_client, udp_log]

va_client:
  id: va
  url: ${va_url}
  token: !secret va_device_token_atom
  microphone: echo_mic
  mic_channel: 0
  input_format: mono16
  # Buys back the level the analog cut cost, WITHOUT re-amplifying the analog
  # noise floor along the way and without touching the wake-word path (unlike
  # the codec's ADC-volume register, which feeds both). Measured after the cut:
  # speech peaked at -27 dBFS over a -41 dBFS floor, so ×8 (+18 dB) lands peaks
  # near -9 dBFS with 9 dB of headroom left for close-range speech.
  mic_gain: 8
  speaker: va_speaker
  on_phase:
    # Stop-model choreography (mirrors the Voice PE config): arm `stop` while
    # the assistant is speaking OR while a follow-up window is behind the
    # current listening phase; disarm otherwise so a false "stop" can't kill
    # the user's own utterance mid-turn. The follow-up case must be decided
    # here: phase emits are deferred to the next loop pass, so this automation
    # runs AFTER on_followup_opened and would undo anything armed there.
    - lambda: |-
        // `listening` arriving while we still think we're idle = the silent
        // ambient follow-up window opening (va_core emits it with no yaml
        // hook); local sessions pre-set va_phase to "waiting" first, and the
        // chimed path sets the flag in on_followup_opened.
        if (phase == "listening" && id(va_phase) == "idle") {
          id(followup_listening) = true;
        } else if (phase != "listening") {
          id(followup_listening) = false;
        }
        id(va_phase) = phase;
    # Shared I2S bus is a mutex (see the speaker block): micro_wake_word holds
    # the mic, so the speaker can't take the bus for the reply until mww
    # releases it. Stop mww on `thinking` — the user's turn is already captured
    # and the mic is idle — so the bus is free by the time `replying` starts and
    # the speaker acquires it on the first try (no 1 s "bus busy" retry). Start
    # it again on `idle`. Consequence: no wake-word/stop detection during a
    # reply — impossible on a single-owner bus (barge-in was already unreliable
    # here without AEC).
    - if:
        condition:
          lambda: 'return phase == "thinking";'
        then:
          - micro_wake_word.stop
    - if:
        condition:
          # Skip while a tone is mid-play — its on_finished_playback restarts
          # mww; starting it here would grab the mic bus and cut the tone.
          lambda: 'return phase == "idle" && !id(tone_playing);'
        then:
          - micro_wake_word.start
    - if:
        condition:
          lambda: 'return phase == "replying" || (phase == "listening" && id(followup_listening));'
        then:
          - micro_wake_word.enable_model: stop
        else:
          - micro_wake_word.disable_model: stop
  on_followup_opened:
    # Server-driven chimed follow-up (realtime.followUpChime). Wait out the
    # reply's DAC/room-echo tail (700 ms, matching va_core's kFollowupOpenDelayMs
    # ambient guard), then play a "your turn" chime; the mic is committed from
    # on_finished_playback (pending_followup) once the chime ends and the bus is
    # free — same handoff as the wake beep.
    - delay: 700ms
    # Skip if something pre-empted the window during the delay (wake word / stop
    # moved us off idle — commit_followup_mic() would no-op).
    - if:
        condition:
          lambda: 'return id(va_phase) == "idle";'
        then:
          - lambda: |-
              id(tone_playing) = true;
              id(pending_followup) = true;
              id(pending_start_session) = false;
          - micro_wake_word.stop
          - delay: 300ms
          - rtttl.play: "turn:d=16,o=6,b=220:e,g"
  on_repeated_failure:
    - logger.log: "va_client: repeated connection failure"
    # Low double-blip so a silent device reads as "backend unreachable", not
    # just idle. Local-only (no WS needed), so safe to play while disconnected.
    - script.execute:
        id: play_cue
        song: "error:d=8,o=4,b=120:c,c"

# Start a fresh turn — shared by the wake word and the button so both behave
# identically: set the phase guard, then beep (start_session fires from rtttl's
# on_finished_playback, once the beep ends and the bus is free) or, with no
# beep enabled, open the mic right away.
script:
  - id: start_turn
    then:
      - lambda: |-
          id(followup_listening) = false;
          id(va_phase) = "waiting";
      - if:
          condition:
            lambda: 'return id(va).wake_sound_enabled();'
          then:
            - lambda: |-
                id(tone_playing) = true;
                id(pending_start_session) = true;
            - micro_wake_word.stop
            # echo_mic releases the mutex a bit after mww STOPs, so wait before
            # the speaker grabs the bus, else rtttl hits "Parent bus is busy".
            - delay: 300ms
            # number after a note is its OCTAVE (4-7), not duration.
            - rtttl.play: "wake:d=16,o=6,b=170:c,e"
          else:
            - lambda: id(va)->start_session();

  # Play a short confirmation tone with the same mutex-bus handoff as the wake
  # beep, then return to idle listening. pending_start_session stays false, so
  # on_finished_playback restarts mww but does NOT open a session.
  - id: play_cue
    mode: restart
    parameters:
      song: string
    then:
      - lambda: |-
          id(tone_playing) = true;
          id(pending_start_session) = false;
      - micro_wake_word.stop
      - delay: 300ms
      - rtttl.play: !lambda 'return song;'

binary_sensor:
  - platform: gpio
    id: action_button
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    # GPIO41 chatters — one physical press fired ~8 events; debounce to one.
    filters:
      - delayed_on_off: 20ms
    # One button = toggle, like the classic Atom Echo: start a turn (with the
    # wake beep) when idle, cancel the in-progress turn otherwise.
    on_click:
      min_length: 20ms
      max_length: 2000ms
      then:
        - if:
            condition:
              lambda: 'return id(va_phase) == "idle";'
            then:
              - script.execute: start_turn
            else:
              - lambda: |-
                  id(followup_listening) = false;
                  id(va)->send_interrupt();
              - script.execute:
                  id: play_cue
                  song: "cancel:d=16,o=5,b=200:g,e"
